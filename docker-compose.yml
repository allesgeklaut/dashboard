services:
  homelab-ctrl:
    build: .
    container_name: homelab-ctrl
    restart: unless-stopped
    ports:
      - "127.0.0.1:7681:7681" # loopback only — reached via cloudflared tunnel, not on LAN
    pid: host # required — psutil reads host CPU / process list
    privileged: false
    environment:
      - TZ=Europe/Vienna
      - HOMELAB_ENERGY_FILE=/data/energy.json
      - HOMELAB_BENCH_FILE=/data/benchmarks.json   # versioned AI Services benchmark snapshots (see SETUP.md)
      # optional benchmark sources; off unless explicitly enabled in the repo .env
      - HOMELAB_LIVEBENCH_ENABLED=${HOMELAB_LIVEBENCH_ENABLED:-false}
      - HOST_NAME=${SYS_HOST_NAME}   # show real host identity (container runs on a bridge net)
      - HOST_IP=${SYS_HOST_IP}
      # Restricted lifecycle gateway; no Portainer admin credential in this app.
      - LIFECYCLE_URL=https://lifecycle-gateway:8443
      - LIFECYCLE_CA_FILE=/run/secrets/lifecycle-server.pem
      - LITELLM_CONFIG_FILE=/run/litellm/config.yaml
      # Go subscription panel is opt-in; LiteLLM inventory stays configured.
      - OPENCODE_GO_ENABLED=${OPENCODE_GO_ENABLED:-false}
      # SECURITY tab — host security-watch report directory, read-only.
      - SECURITY_REPORT_DIR=/run/security-watch
      # HEALTH tab — host server-health state directory, read-only.
      - HEALTH_REPORT_DIR=/run/server-health
      # feature flag — set STREAM_SPOOL_DIR= in .env to disable the stream feature
      - STREAM_SPOOL_DIR=${STREAM_SPOOL_DIR-/stream-spool}
      # desktop wake/poweroff request spool (host handler acts on it)
      - DESKTOP_SPOOL_DIR=${DESKTOP_SPOOL_DIR-/desktop-spool}
      # desktop wake-on-LAN + up/off status probe — values live in the repo
      # .env (gitignored; real device identifiers never go in git or secrets).
      # The magic packet itself is broadcast host-side via the spool handler
      # (host/desktop-power-handler.sh, reads WOL_BROADCAST/WOL_PORT from the
      # repo .env) — the container only needs MAC (flags) and IP (status).
      - WOL_DESKTOP_MAC=${WOL_DESKTOP_MAC:-}
      - WOL_DESKTOP_IP=${WOL_DESKTOP_IP:-}
    volumes:
      - type: bind
        source: ${LITELLM_CONFIG_HOST_PATH:-../litellm/config.yaml}
        target: /run/litellm/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/secrets/lifecycle-server.pem
        target: /run/secrets/lifecycle-server.pem
        read_only: true
        bind:
          create_host_path: false
      # Whole report directory: the host watch replaces latest.json atomically,
      # so a single-file mount would keep serving the old inode. Source must exist.
      - type: bind
        source: "${SECURITY_REPORT_HOST_PATH:-${HOME}/.local/state/security-watch}"
        target: /run/security-watch
        read_only: true
        bind:
          create_host_path: false
      # Whole state directory, same atomic-replace reason as the security
      # watch: server-health.sh replaces latest.json via os.replace, so a
      # single-file mount would keep serving the old inode. Source must exist.
      - type: bind
        source: "${HEALTH_REPORT_HOST_PATH:-${HOME}/.local/state/server-health}"
        target: /run/server-health
        read_only: true
        bind:
          create_host_path: false
      - /mnt/nas:/mnt/nas:ro # NFS mounts visible
      - ${HOME}/.homelab-ctrl:/data # energy tracking dir (file: energy.json)
      - ${HOME}/.homelab-ctrl/stream-spool:/stream-spool # stream up/down request spool (see host/)
      - ${HOME}/.homelab-ctrl/desktop-spool:/desktop-spool # desktop wake/poweroff request spool (see host/)
      - /sys/class/drm:/sys/class/drm:ro             # AMD GPU utilisation (gpu_busy_percent)
      - /sys/class/hwmon:/sys/class/hwmon:ro          # AMD GPU hwmon (temp, fan, power)
    env_file:
      - /opt/secrets/dashboard.env
      - /opt/secrets/lifecycle-dashboard.env
    networks: [default, lifecycle_control]

networks:
  lifecycle_control:
    external: true
    name: lifecycle_control
