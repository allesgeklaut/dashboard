services:
  homelab-ctrl:
    build: .
    container_name: homelab-ctrl
    restart: unless-stopped
    ports:
      - "127.0.0.1:7681:7681" # loopback only — reached via cloudflared tunnel, not on LAN
    pid: host # required — psutil reads host CPU / process list
    privileged: false
    environment:
      - TZ=Europe/Vienna
      - HOMELAB_ENERGY_FILE=/data/energy.json
      - HOMELAB_BENCH_FILE=/data/benchmarks.json   # on-demand model scores (see OPENCODE tab)
      - HOST_NAME=${SYS_HOST_NAME}   # show real host identity (container runs on a bridge net)
      - HOST_IP=${SYS_HOST_IP}
      # feature flag — set STREAM_SPOOL_DIR= in .env to disable the stream feature
      - STREAM_SPOOL_DIR=${STREAM_SPOOL_DIR:-/stream-spool}
      # desktop wake/poweroff request spool (host handler acts on it)
      - DESKTOP_SPOOL_DIR=${DESKTOP_SPOOL_DIR:-/desktop-spool}
      # desktop wake-on-LAN + up/off status probe — values live in the repo
      # .env (gitignored; real device identifiers never go in git or secrets).
      # The magic packet itself is broadcast host-side via the spool handler
      # (host/desktop-power-handler.sh, reads WOL_BROADCAST/WOL_PORT from the
      # repo .env) — the container only needs MAC (flags) and IP (status).
      - WOL_DESKTOP_MAC=${WOL_DESKTOP_MAC:-}
      - WOL_DESKTOP_IP=${WOL_DESKTOP_IP:-}
    volumes:
      - /mnt/nas:/mnt/nas:ro # NFS mounts visible
      - ${HOME}/.homelab-ctrl:/data # energy tracking dir (file: energy.json)
      - ${HOME}/.homelab-ctrl/stream-spool:/stream-spool # stream up/down request spool (see host/)
      - ${HOME}/.homelab-ctrl/desktop-spool:/desktop-spool # desktop wake/poweroff request spool (see host/)
      - /sys/class/drm:/sys/class/drm:ro             # AMD GPU utilisation (gpu_busy_percent)
      - /sys/class/hwmon:/sys/class/hwmon:ro          # AMD GPU hwmon (temp, fan, power)
    env_file:
      - /opt/secrets/dashboard.env
      - /opt/secrets/portainer.env
