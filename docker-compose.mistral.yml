services:
  homelab-ctrl:
    environment:
      - LITELLM_CONFIG_FILE=/run/litellm/config.yaml
    volumes:
      - type: bind
        source: ${LITELLM_CONFIG_HOST_PATH:-../litellm/config.yaml}
        target: /run/litellm/config.yaml
        read_only: true
        bind:
          create_host_path: false
